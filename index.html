<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1E2F5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>원격 통역 대화</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#F4F1EA;--card:#fff;--ink:#1A2238;--sub:#6B7280;--line:#E8E3D9;--navy:#1E2F5C;--navy2:#34508F;--coral:#F2724B;--coral2:#F7A072;--teal:#1FA38A;--mine:#1E2F5C;--mineInk:#fff;--theirs:#fff;--theirsInk:#1A2238;--soft:#EDE8DE;--fs:1}
body[data-theme=night]{--bg:#0E1424;--card:#172038;--ink:#E8ECF5;--sub:#93A0BC;--line:#26314F;--navy:#4C6CC0;--navy2:#6A88D8;--mine:#2B437F;--theirs:#1D2846;--theirsInk:#E8ECF5;--soft:#1D2846}
body[data-theme=sea]{--bg:#E9F3F2;--line:#D3E5E3;--navy:#0F5E6B;--navy2:#1C8796;--mine:#0F5E6B;--soft:#DCECEA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
.hidden{display:none!important}
.screen{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.scroll{overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}

/* ---------- 시작 화면 ---------- */
#splash{background:radial-gradient(120% 80% at 80% 0%,#3B5BA9 0%,transparent 60%),radial-gradient(90% 70% at 0% 100%,#F2724B55 0%,transparent 60%),linear-gradient(160deg,#1E2F5C 0%,#16213F 100%);color:#fff;align-items:center;justify-content:space-between;cursor:pointer;overflow:hidden}
#splash .ver{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:18px;font-size:13px;opacity:.55}
#splash .art{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;padding:40px 20px 0}
#splash .art svg{width:min(88vw,400px);height:auto;max-height:52vh}
#splash h1{font-size:34px;font-weight:800;letter-spacing:-.03em;text-align:center}
#splash p.sub{margin-top:10px;font-size:16px;opacity:.75;text-align:center}
#splash .go{margin:34px 0 calc(48px + env(safe-area-inset-bottom));padding:15px 42px;border-radius:40px;background:#fff;color:#1E2F5C;font-weight:700;font-size:17px;box-shadow:0 10px 30px #0006;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05)}}
.float{animation:fl 5s ease-in-out infinite}.float.d2{animation-delay:-2.5s}
@keyframes fl{50%{transform:translateY(-8px)}}

/* ---------- 홈 ---------- */
#home{background:var(--bg)}
.hhead{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--navy),var(--navy2));display:grid;place-items:center;color:#fff}
.hhead h2{font-size:19px;font-weight:800;flex:1}
.hhead .ver{font-size:12px;color:var(--sub);padding:6px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:var(--soft)}
.me{margin:8px 18px 0;background:var(--card);border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 0 var(--line)}
.ava{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--coral2));color:#fff;display:grid;place-items:center;font-size:21px;font-weight:700;flex:none}
.me .info{flex:1;min-width:0}
.me .lbl{font-size:12px;color:var(--sub)}
.me input{width:100%;border:0;background:transparent;font-size:20px;font-weight:700;padding:2px 0;outline:none}
.me input::placeholder{color:#B9B3A7;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:30px;background:var(--soft);font-weight:600;font-size:15px;white-space:nowrap}
.acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin:14px 18px 0}
.card-new{border-radius:22px;padding:18px 16px;min-height:132px;background:linear-gradient(145deg,var(--navy),var(--navy2));color:#fff;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:0 10px 24px #1E2F5C33}
.card-new .pl{width:38px;height:38px;border-radius:12px;background:#ffffff26;display:grid;place-items:center}
.card-new b{font-size:18px;font-weight:700;line-height:1.3}
.card-join{border-radius:22px;padding:16px;min-height:132px;background:linear-gradient(145deg,var(--coral),var(--coral2));color:#fff;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 24px #F2724B33}
.card-join b{font-size:16px;font-weight:700}
.joinrow{display:flex;gap:6px}
.joinrow input{flex:1;min-width:0;width:100%;border:0;border-radius:12px;padding:10px;font-size:20px;font-weight:700;letter-spacing:.12em;text-align:center;background:#fff;color:#C2522F;outline:none}
.joinrow input::placeholder{letter-spacing:0;font-size:14px;font-weight:600;color:#E3A58C}
.joinrow button{width:44px;flex:none;border-radius:12px;background:#ffffff33;display:grid;place-items:center;color:#fff}
.sect{display:flex;align-items:center;gap:8px;margin:22px 22px 10px;font-size:15px;font-weight:700;color:var(--navy)}
.sect:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--navy)}
.sect span{color:var(--sub);font-weight:500;font-size:13px}
#roomList{flex:1;min-height:0;padding:0 18px 18px}
.ritem{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 8px 12px 14px;margin-bottom:9px;border-left:4px solid var(--navy)}
.ritem .rico{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--navy);display:grid;place-items:center;flex:none}
.ritem .rt{flex:1;min-width:0}
.ritem .rt b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .rt small{font-size:13px;color:var(--sub)}
.badge{font-size:11px;padding:2px 7px;border-radius:8px;background:var(--navy);color:#fff;margin-left:4px;vertical-align:1px;font-weight:600}
.badge.g{background:var(--soft);color:var(--sub)}
.ritem .del{width:42px;height:42px;border-radius:12px;color:#B5ADA0;display:grid;place-items:center}
.ritem .del:active{background:#FDECE6;color:var(--coral)}
.empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:14px;line-height:1.6}

/* ---------- 대화방 ---------- */
#room{background:var(--bg)}
.top{display:flex;align-items:center;gap:2px;padding:8px 8px 8px 6px;background:var(--card);border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0;padding:2px 6px;text-align:left;border-radius:10px}
.ttl b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden}
.dot{width:7px;height:7px;border-radius:50%;background:var(--teal);flex:none}
.dot.off{background:#E04848}.dot.free{background:#E3A008}
.top .iconbtn{width:38px;height:38px}
.top .iconbtn.on{color:var(--navy)}
.top .iconbtn.muted{color:#B5ADA0}
#chat{flex:1;min-height:0;padding:14px 14px 20px}
.msg{display:flex;flex-direction:column;margin-bottom:14px;max-width:86%}
.msg.mine{margin-left:auto;align-items:flex-end}
.msg .who{font-size:12px;color:var(--sub);margin:0 6px 4px}
.bub{position:relative;border-radius:20px;padding:12px 44px 12px 15px;background:var(--theirs);color:var(--theirsInk);box-shadow:0 1px 2px #0000000d;border-top-left-radius:6px}
.mine .bub{background:var(--mine);color:var(--mineInk);border-top-left-radius:20px;border-top-right-radius:6px}
.bub .main{font-size:calc(19px * var(--fs));font-weight:600;line-height:1.42;word-break:keep-all;overflow-wrap:anywhere}
.bub .sub{font-size:calc(14px * var(--fs));line-height:1.45;margin-top:6px;opacity:.62;word-break:keep-all;overflow-wrap:anywhere}
.bub .sub i{font-style:normal;font-size:11px;padding:1px 6px;border-radius:6px;background:#8881;margin-right:5px;opacity:.9}
.bub .say{position:absolute;right:6px;top:7px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;opacity:.55;color:inherit}
.bub .say .ic{width:18px;height:18px}
.bub .wait{opacity:.5;font-weight:500}
.free-tag{font-size:10px;opacity:.5;margin-left:6px}
.draft .bub{background:transparent;color:var(--ink);border:2px dashed var(--navy2);padding-right:15px}
.dbar{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--sub);width:100%}
.dbar .pg{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;min-width:60px}
.dbar .pg div{height:100%;background:var(--navy2);width:100%}
.dbar button{padding:4px 10px;border-radius:10px;background:var(--soft);font-size:12px;font-weight:600}
.dbar button.x{color:var(--coral)}
.chat-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--sub);text-align:center;font-size:15px;line-height:1.6;padding:20px}
.chat-empty .big{width:84px;height:84px;border-radius:28px;background:var(--card);display:grid;place-items:center;color:var(--navy)}
.chat-empty .big .ic{width:40px;height:40px;stroke-width:1.4}
.chat-empty button{margin-top:4px;padding:11px 20px;border-radius:24px;background:var(--navy);color:#fff;font-weight:600;display:inline-flex;gap:8px;align-items:center}
#talking{font-size:12px;color:var(--sub);padding:0 18px 4px;min-height:18px}
.live{min-height:24px;padding:0 20px 6px;text-align:center;font-size:calc(16px * var(--fs));color:var(--navy2);font-weight:500;line-height:1.4;max-height:66px;overflow:hidden}
.bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 18px 14px;background:var(--bg)}
.side{display:flex;gap:8px;align-items:center}
.side.r{justify-content:flex-end}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--sub);min-width:54px;padding:6px 4px;border-radius:14px}
.tool:active{background:var(--soft)}
.tool .tb{width:44px;height:44px;border-radius:15px;background:var(--card);display:grid;place-items:center;color:var(--ink);box-shadow:0 1px 0 var(--line)}
.tool .tb .fsg{font-weight:800;line-height:1;transition:font-size .15s}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
#mic{position:relative;width:82px;height:82px;border-radius:50%;background:linear-gradient(145deg,var(--navy),var(--navy2));color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px #1E2F5C44;transition:transform .15s}
#mic:active{transform:scale(.95)}
#mic .ic{width:34px;height:34px;stroke-width:1.6}
#mic.on{background:linear-gradient(145deg,var(--coral),#E85A33);box-shadow:0 10px 26px #F2724B55}
#mic.on:before,#mic.on:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--coral);opacity:0;animation:ring 1.8s ease-out infinite}
#mic.on:after{animation-delay:.9s}
#mic.hold{opacity:.65}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.35);opacity:0}}
.micl{font-size:12px;color:var(--sub);white-space:nowrap}

/* 오른쪽 서랍 */
#handle{position:absolute;right:0;top:42%;width:26px;height:64px;border-radius:14px 0 0 14px;background:var(--card);box-shadow:-2px 0 10px #0000001a;display:grid;place-items:center;color:var(--navy);z-index:5}
#handle .ic{width:18px;height:18px}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(86vw,360px);background:var(--card);z-index:40;transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);box-shadow:-10px 0 30px #0002}
#drawer.open{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 8px 18px}
.dhead b{font-size:17px}
.compose{margin:4px 14px 10px;border-radius:16px;background:var(--soft);padding:10px;display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;border:0;background:transparent;resize:none;outline:none;font-size:16px;line-height:1.4;max-height:120px}
.compose button{width:42px;height:42px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}
.plist{flex:1;min-height:0;padding:4px 14px 20px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.ph{padding:12px 10px;border-radius:14px;background:var(--bg);font-size:15px;font-weight:600;text-align:center;line-height:1.3;word-break:keep-all;min-height:50px;user-select:none;-webkit-user-select:none}
.ph:active{background:var(--soft)}
.ph.add{border:1.5px dashed var(--line);background:transparent;color:var(--sub)}
.dhint{font-size:12px;color:var(--sub);padding:0 18px 8px}

/* 시트·팝업 */
#dim{position:fixed;inset:0;background:#0F172A73;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88dvh;background:var(--card);border-radius:24px 24px 0 0;z-index:50;transform:translateY(105%);transition:transform .25s ease;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:none}
.sheet.tall{height:88dvh}
.shead{display:flex;align-items:center;gap:8px;padding:16px 12px 10px 20px}
.shead b{font-size:18px;flex:1}
.shead .ver{font-size:13px;color:var(--sub);padding:8px}
.sbody{padding:4px 20px 24px;flex:1;min-height:0}
.tabs{display:flex;gap:6px;padding:0 16px 10px}
.tabs button{flex:1;padding:10px 4px;border-radius:12px;font-weight:600;font-size:14px;color:var(--sub);background:var(--bg)}
.tabs button.on{background:var(--navy);color:#fff}
.row{padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row>label,.row .rl{display:block;font-size:14px;font-weight:600;margin-bottom:9px}
.row .hint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px 2px;border-radius:10px;font-size:14px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 3px #0002}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw span{font-size:14px;font-weight:600}
.tg{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px #0003}
.tg.on{background:var(--navy)}.tg.on:after{transform:translateX(20px)}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg);font-size:15px;outline:none}
.inp:focus{border-color:var(--navy2)}
textarea.inp{resize:vertical;min-height:90px;line-height:1.5}
.btn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:13px;background:var(--soft);font-weight:600;font-size:15px}
.btn.pri{background:var(--navy);color:#fff}
.btn.warn{background:#FDECE6;color:#C2522F}
.btn.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 0}
.lnk{font-size:13px;color:var(--navy2);font-weight:600;text-decoration:none;display:inline-block;margin-top:8px}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--navy)}
.range b{min-width:44px;text-align:right;color:var(--navy)}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lgrid button{padding:13px 10px;border-radius:14px;background:var(--bg);text-align:left}
.lgrid button b{display:block;font-size:15px}
.lgrid button small{font-size:12px;color:var(--sub)}
.lgrid button.on{background:var(--navy);color:#fff}.lgrid button.on small{color:#fff9}
.mem{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.mem .ava{width:38px;height:38px;font-size:16px}
.mem .mi{flex:1}.mem .mi b{font-size:15px}.mem .mi small{display:block;font-size:12px;color:var(--sub)}
.code-big{font-size:40px;font-weight:800;letter-spacing:.14em;text-align:center;color:var(--navy);padding:6px 0 2px}
.travel h4{font-size:14px;color:var(--navy);margin:16px 0 8px}
.travel .tp{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.travel .tp span{flex:1}
.travel .tp button{width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--navy)}
#modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;background:#0F172A80}
#modal .box{width:100%;max-width:340px;background:var(--card);border-radius:22px;padding:22px 20px 16px;text-align:center}
#modal .box h3{font-size:18px;margin-bottom:8px}
#modal .box p{font-size:14px;color:var(--sub);line-height:1.55;margin-bottom:18px;white-space:pre-line}
#modal .box .btns{flex-direction:column}
#toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1A2238E8;color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;z-index:90;opacity:0;transition:.2s;pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body data-theme="basic">

<!-- 시작 화면 -->
<div id="splash" class="screen">
  <div class="ver" data-ver></div>
  <div class="art">
    <svg viewBox="0 0 400 330" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/></linearGradient>
        <linearGradient id="gB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7A072"/><stop offset="1" stop-color="#F2724B"/></linearGradient>
        <linearGradient id="gC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8FB0F5"/><stop offset="1" stop-color="#5B7FD6"/></linearGradient>
      </defs>
      <circle cx="200" cy="165" r="118" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="1.5"/>
      <circle cx="200" cy="165" r="150" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="1.5"/>
      <g stroke="#fff" stroke-opacity=".28" stroke-width="1.4" fill="none">
        <circle cx="200" cy="165" r="44"/><path d="M156 165h88M200 121c14 13 20 27 20 44s-6 31-20 44c-14-13-20-27-20-44s6-31 20-44z"/>
      </g>
      <path d="M118 150 C 150 90, 250 90, 282 150" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/>
      <g class="float">
        <rect x="40" y="110" width="92" height="170" rx="20" fill="url(#gA)" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
        <rect x="74" y="122" width="24" height="5" rx="2.5" fill="#fff" fill-opacity=".5"/>
        <rect x="52" y="146" width="66" height="30" rx="12" fill="url(#gB)"/>
        <text x="85" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="sans-serif">안녕하세요</text>

let fb=null,connected=false;
async function fbInit(){
 try{
  const cfg=S.get('fbcfg',null)||DEFAULT_FB;
  const A=await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`);
  const D=await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-database.js`);

/* ---------- 대화방 ---------- */
let room=null;
const pending=new Map();let tickT=null;
const spoken=new Set();const localTr=new Map();
async function createRoom(){
 if(needName())return;
 if(!fb||!connected){toast(t('offlineFb'));return}
 let code;for(let i=0;i<8;i++){code=String(Math.floor(100000+Math.random()*900000));const s=await fb.get(R(`rooms/${code}/meta`));if(!s.exists())break}
 const d=new Date();const title=(ui()==='ko'?`${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} 대화방`:`Room ${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`);
 await fb.set(R(`rooms/${code}/meta`),{host:me.cid,hostName:me.name,title,created:fb.serverTimestamp()});
 await enterRoom(code);
}
async function enterRoom(code){
 if(needName())return;
 if(!fb){toast(t('offlineFb'));return}
 let ms;try{ms=await fb.get(R(`rooms/${code}/meta`))}catch{toast(t('offlineFb'));return}
 if(!ms.exists()){toast(t('noRoom'));rooms=rooms.filter(r=>r.code!==code);S.set('rooms',rooms);renderRooms();return}
 const meta=ms.val();
 room={code,meta,isHost:meta.host===me.cid,members:{},msgs:new Map(),unsub:[],joinKey:fb.push(R('x')).key,clearKey:S.get('clr_'+code,'')};
 saveRoomEntry(code,meta.title,room.isHost?'host':'guest');
 const mref=R(`rooms/${code}/members/${me.cid}`);
 await fb.update(mref,{name:me.name,lang:me.lang,online:true,talk:false,ts:fb.serverTimestamp()});
 fb.onDisconnect(mref).update({online:false,talk:false});
 room.unsub.push(fb.onValue(R(`rooms/${code}/meta`),s=>{if(!room)return;if(!s.exists()){leaveRoom();toast(t('noRoom'));return}room.meta=s.val();updateStatus()}));
 room.unsub.push(fb.onValue(R(`rooms/${code}/members`),s=>{if(!room)return;room.members=s.val()||{};updateStatus();updateTalking();if(room.isHost)room.msgs.forEach((m,id)=>{if(id>room.joinKey)hostProcess(id)})}));
 const q=fb.query(R(`rooms/${code}/msgs`),fb.limitToLast(150));
 room.unsub.push(fb.onChildAdded(q,s=>onMsg(s.key,s.val())));
 room.unsub.push(fb.onChildChanged(q,s=>onMsg(s.key,s.val())));
 room.unsub.push(fb.onChildRemoved(q,s=>{if(!room)return;room.msgs.delete(s.key);document.getElementById('m-'+s.key)?.remove();checkEmpty()}));
 $('#chat').innerHTML='';checkEmpty();
 history.replaceState(null,'',location.pathname+'?room='+code);
 show('#room');updateStatus();updateMicUI();wake(true);
}
function leaveRoom(){
 if(!room)return;stopListen();speechSynthesis.cancel();ttsQ.length=0;speaking=false;
 pending.forEach((p,id)=>{if(p.written)fb.remove(R(`rooms/${room.code}/msgs/${id}`)).catch(()=>{})});pending.clear();
 try{fb.update(R(`rooms/${room.code}/members/${me.cid}`),{online:false,talk:false})}catch{}
 room.unsub.forEach(f=>{try{f()}catch{}});room=null;wake(false);
 history.replaceState(null,'',location.pathname);
 renderRooms();show('#home');
}
function membersOnline(){return Object.entries(room?.members||{}).filter(([,m])=>m.online)}
function targetLangs(src){const s=new Set();membersOnline().forEach(([,m])=>{if(m.lang&&m.lang!==src)s.add(m.lang)});return [...s]}
function hostOnline(){return !!(room&&room.members[room.meta.host]?.online)}
function engineName(e){return {gemini:'Gemini',claude:'Claude',openai:'ChatGPT',free:t('freeTr')}[e]||e}
function updateStatus(){
 if(!room)return;
 $('#rTitle').textContent=room.meta.title||room.code;
 const n=membersOnline().length;const dot=$('#rDot');let txt;
 if(!connected){dot.className='dot off';txt=t('disconnected')}
 else if(room.isHost){const e=activeEngine();dot.className='dot'+(e==='free'?' free':'');txt=engineName(e)}
 else if(hostOnline()){dot.className='dot';txt=t('hostTr')}
 else{dot.className='dot free';txt=t('freeTr')}
 $('#rSub').textContent=`${room.code} · ${n}${t('persons')} · ${txt}`;
}
function updateTalking(){const ns=Object.entries(room?.members||{}).filter(([id,m])=>id!==me.cid&&m.online&&m.talk).map(([,m])=>m.name);$('#talking').textContent=ns.length?ns.join(', ')+t('talkingNow'):''}
function checkEmpty(){
 const chat=$('#chat');const has=chat.querySelector('.msg');let e=chat.querySelector('.chat-empty');
 if(has){e&&e.remove();return}
 if(!e){chat.innerHTML=`<div class="chat-empty"><div class="big">${icon('chat')}</div><div>${t('emptyChat')}</div><button data-act="invite">${icon('userplus')}<span>${t('inviteBtn')}</span></button></div>`}
}

/* ---------- 메시지 ---------- */
function onMsg(id,v){
 if(!room||!v)return;
 room.msgs.set(id,{id,...v});
 if(room.isHost)hostProcess(id);
 renderMsg(id);maybeSpeak(id);
}
function trFor(m,lang){if(m.lang===lang)return m.text;if(m.tr&&m.tr[lang]&&m.trSrc===m.text)return m.tr[lang];return localTr.get(id2(m,lang))}
const id2=(m,lang)=>m.id+'|'+lang+'|'+m.text;
function renderMsg(id){
 const m=room.msgs.get(id);if(!m)return;
 const mine=m.from===me.cid;const p=pending.get(id);
 const visible=m.state==='sent'||(mine&&p)&&m.state!=='cancel';
 let el=document.getElementById('m-'+id);
 if(!visible||(room.clearKey&&id<=room.clearKey)){el&&el.remove();checkEmpty();return}
 const chat=$('#chat');const atBottom=chat.scrollHeight-chat.scrollTop-chat.clientHeight<80;
 if(!el){el=document.createElement('div');el.id='m-'+id;el.className='msg';chat.appendChild(el);checkEmpty()}
 el.className='msg '+(mine?'mine':'theirs')+(p?' draft':'');
 let main,sub='';
 if(mine){
  main=esc(m.text);
  if(!p){const tl=targetLangs(m.lang);const tx=(tl.length?tl:Object.keys(m.tr||{})).slice(0,3).map(l=>{const x=trFor(m,l);return x?`<div class="sub"><i>${esc(L(l).nat)}</i>${esc(x)}</div>`:''}).join('');sub=tx||(tl.length?`<div class="sub wait">${t('translating')}</div>`:'')}
 }else{
  const x=trFor(m,me.lang);
  main=x?esc(x):`<span class="wait">${t('translating')}</span>`;
  if(m.lang!==me.lang)sub=`<div class="sub">${esc(m.text)}</div>`;
  if(!x)scheduleLocalTr(m);
 }
 const free=m.eng==='free'&&!mine?`<span class="free-tag">${t('freeTr')}</span>`:'';
 el.innerHTML=`<div class="who">${esc(mine?t('me'):m.name)} · ${esc(L(m.lang).nat)}${free}</div><div class="bub"${p?' data-act="editDraft" data-id="'+id+'"':''}><div class="main">${main}</div>${sub}${p?'':`<button class="say" data-act="say" data-id="${id}">${icon('vol')}</button>`}</div>${p?`<div class="dbar"><div class="pg"><div id="pg-${id}"></div></div><button data-act="editDraft" data-id="${id}">${t('edit')}</button><button class="x" data-act="cancelDraft" data-id="${id}">${t('cancel')}</button></div>`:''}`;
 if(atBottom||mine)chat.scrollTop=chat.scrollHeight;
}
const localTrPending=new Set();
function scheduleLocalTr(m){
 const k=id2(m,me.lang);if(localTrPending.has(k))return;localTrPending.add(k);
 setTimeout(async()=>{
  const cur=room?.msgs.get(m.id);if(!cur||cur.text!==m.text||trFor(cur,me.lang))return;
  try{const out=await freeTranslate(m.text,m.lang,me.lang);localTr.set(k,out);renderMsg(m.id);maybeSpeak(m.id)}catch{}
 },hostOnline()?6000:1200);
}

/* 내 말 → 초안(확인 시간) → 보내기 */
function newDraft(text){
 if(!room||!text)return;
 const r=fb.push(R(`rooms/${room.code}/msgs`));const id=r.key;
 const base={from:me.cid,name:me.name,lang:me.lang,text,state:'draft',ts:fb.serverTimestamp()};
 if(!set.confirm){fb.set(r,{...base,state:'sent'});afterSent(id);return}
 const written=!!set.prefetch;
 pending.set(id,{left:set.confirm*1000,total:set.confirm*1000,paused:false,written,base});
 if(written)fb.set(r,base);else{room.msgs.set(id,{id,...base});renderMsg(id)}
 if(!tickT)tickT=setInterval(tick,100);
}
function tick(){
 if(!pending.size){clearInterval(tickT);tickT=null;return}
 pending.forEach((p,id)=>{if(p.paused)return;p.left-=100;const b=document.getElementById('pg-'+id);if(b)b.style.width=Math.max(0,p.left/p.total*100)+'%';if(p.left<=0)sendDraft(id)});
}
function sendDraft(id,newText){
 const p=pending.get(id);if(!p||!room)return;pending.delete(id);
 const m=room.msgs.get(id)||{};const text=(newText??m.text??p.base.text).trim();
 if(!text){cancelDraft(id);return}
 const r=R(`rooms/${room.code}/msgs/${id}`);
 if(p.written)fb.update(r,{text,state:'sent',ts:fb.serverTimestamp()});else fb.set(r,{...p.base,text,state:'sent'});
 const cur=room.msgs.get(id);if(cur){cur.text=text;cur.state='sent'}
 renderMsg(id);afterSent(id);
}
function cancelDraft(id){
 const p=pending.get(id);pending.delete(id);if(!room)return;
 if(p&&p.written)fb.remove(R(`rooms/${room.code}/msgs/${id}`));
 room.msgs.delete(id);document.getElementById('m-'+id)?.remove();checkEmpty();
}
let editing=false;
function editDraft(id){
 const p=pending.get(id);const m=room.msgs.get(id);if(!p||!m)return;
 p.paused=true;editing=true;abortRec();
 genSheet(t('edit'),`<textarea class="inp" id="edTx" style="font-size:18px;min-height:120px">${esc(m.text)}</textarea><div class="btns" style="margin-top:12px"><button class="btn warn" id="edDel">${t('del')}</button><button class="btn pri" id="edOk">${t('send')}</button></div>`,()=>{editing=false;if(pending.has(id)){p.paused=false}resumeRec()});
 const tx=$('#edTx');tx.focus();tx.setSelectionRange(tx.value.length,tx.value.length);
 if(p.written)tx.oninput=()=>{clearTimeout(tx._t);tx._t=setTimeout(()=>{const v=tx.value.trim();if(v&&pending.has(id)){fb.update(R(`rooms/${room.code}/msgs/${id}`),{text:v})}},500)};
 $('#edOk').onclick=()=>{const v=tx.value;closeSheet(true);editing=false;sendDraft(id,v);resumeRec()};
 $('#edDel').onclick=()=>{closeSheet(true);editing=false;cancelDraft(id);resumeRec()};
}
function sendNow(text){
 if(!room||!(text=text.trim()))return;
 const r=fb.push(R(`rooms/${room.code}/msgs`));
 fb.set(r,{from:me.cid,name:me.name,lang:me.lang,text,state:'sent',ts:fb.serverTimestamp()});
 afterSent(r.key);
}
/* 방장 폰이 없거나 느리면 보낸 사람 폰이 무료 번역으로 채움 */
function afterSent(id){
 if(!room||room.isHost)return;
 setTimeout(async()=>{
  const m=room?.msgs.get(id);if(!m)return;
  const need=targetLangs(m.lang).filter(l=>!(m.tr&&m.tr[l]&&m.trSrc===m.text));
  if(!need.length)return;
  try{const out={};for(const l of need)out[l]=await freeTranslate(m.text,m.lang,l);
   const cur=room?.msgs.get(id);if(!cur||cur.text!==m.text)return;
   const still=need.filter(l=>!(cur.tr&&cur.tr[l]&&cur.trSrc===cur.text));if(!still.length)return;
   const upd={trSrc:m.text,eng:'free'};if(cur.trSrc===m.text)still.forEach(l=>upd['tr/'+l]=out[l]);else upd.tr=out;
   fb.update(R(`rooms/${room.code}/msgs/${id}`),upd);
  }catch{}
 },hostOnline()?4500:30);
}

/* ---------- 방장 폰 = 번역 서버 ---------- */
const inflight=new Set();
async function hostProcess(id){
 const m=room?.msgs.get(id);if(!m||!m.text||m.state==='cancel')return;
 const targets=targetLangs(m.lang);if(!targets.length)return;
 const fresh=m.trSrc!==m.text;
 const need=fresh?targets:targets.filter(l=>!(m.tr||{})[l]);if(!need.length)return;
 const key=id+'|'+m.text+'|'+need.join(',');if(inflight.has(key))return;inflight.add(key);
 try{
  const r=await translateMulti(m.text,m.lang,need);
  const cur=room?.msgs.get(id);if(!cur||cur.text!==m.text)return;
  const upd={trSrc:m.text,eng:r.eng};
  if(cur.trSrc===m.text){need.forEach(l=>{if(r.out[l])upd['tr/'+l]=r.out[l]})}else upd.tr=r.out;
  await fb.update(R(`rooms/${room.code}/msgs/${id}`),upd);
 }catch(e){console.warn(e)}finally{inflight.delete(key)}
}
function activeEngine(){const e=set.engine;if(e==='gemini'&&set.gkey)return e;if(e==='claude'&&set.ckey)return e;if(e==='openai'&&set.okey)return e;return 'free'}
function glossary(){return set.gloss.split('\n').map(s=>s.trim()).filter(s=>s.includes('=')).slice(0,80).join('\n')}
function aiPrompt(text,src,targets){
 const g=glossary();
 return `You are a live interpreter in a voice call. Translate the ${L(src).en} sentence into each target language. Keep it natural and spoken, same tone and politeness, no explanations.${g?`\nGlossary (use these exact terms):\n${g}`:''}\nTargets (JSON keys): ${targets.map(c=>`"${c}" = ${L(c).en}`).join(', ')}\nReply ONLY with a JSON object like {${targets.map(c=>`"${c}":"..."`).join(',')}}.\nSentence: ${text}`;
}
function parseJSON(s){s=String(s||'').replace(/^```(json)?/i,'').replace(/```\s*$/,'').trim();const a=s.indexOf('{'),b=s.lastIndexOf('}');return JSON.parse(s.slice(a,b+1))}
async function translateMulti(text,src,targets,engine=activeEngine()){
 if(engine!=='free'){
  try{const out=await aiTranslate(engine,text,src,targets);if(targets.every(l=>out[l]))return{out,eng:engine}}catch(e){console.warn('AI 번역 실패, 무료로 대체',e)}
 }
 const out={};await Promise.all(targets.map(async l=>{out[l]=await freeTranslate(text,src,l)}));
 return{out,eng:'free'};
}
async function aiTranslate(engine,text,src,targets){
 const prompt=aiPrompt(text,src,targets);
 if(engine==='gemini'){
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(set.gmodel||'gemini-2.5-flash')}:generateContent?key=${encodeURIComponent(set.gkey)}`;
  const body=th=>({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:.2,responseMimeType:'application/json',...(th?{thinkingConfig:{thinkingBudget:0}}:{})}});
  let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body(true))});
  if(r.status===400)r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body(false))});
  if(!r.ok)throw new Error('Gemini '+r.status);
  const j=await r.json();return parseJSON(j.candidates?.[0]?.content?.parts?.map(p=>p.text).join(''));
 }
 if(engine==='claude'){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':set.ckey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:set.cmodel||'claude-haiku-4-5',max_tokens:1024,temperature:.2,messages:[{role:'user',content:prompt}]})});
  if(!r.ok)throw new Error('Claude '+r.status);
  const j=await r.json();return parseJSON(j.content?.map(c=>c.text).join(''));
 }
 if(engine==='openai'){
  const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+set.okey},body:JSON.stringify({model:set.omodel||'gpt-4.1-mini',response_format:{type:'json_object'},messages:[{role:'user',content:prompt}]})});
  if(!r.ok)throw new Error('ChatGPT '+r.status);
  const j=await r.json();return parseJSON(j.choices?.[0]?.message?.content);
 }
 throw new Error('engine');
}
async function freeTranslate(text,src,tgt){
 const u=`https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=${L(src).g}&tl=${L(tgt).g}&q=${encodeURIComponent(text)}`;
 const r=await fetch(u);if(!r.ok)throw new Error('free '+r.status);const j=await r.json();
 return (j[0]||[]).map(x=>x[0]).join('');
}

/* ---------- 소리(휴대폰 기본 목소리) ---------- */
const ttsQ=[];let speaking=false,ttsGuard;
function voicesFor(lang){const sr=L(lang).sr.toLowerCase().replace('_','-');const b=sr.split('-')[0];const vs=speechSynthesis.getVoices();return vs.filter(v=>v.lang.toLowerCase().replace('_','-')===sr).concat(vs.filter(v=>{const l=v.lang.toLowerCase().replace('_','-');return l!==sr&&l.split('-')[0]===b&&(b!=='zh'||l.includes(sr.split('-')[1]))}))}
function speak(text,lang,front){if(!text)return;const it={text,lang};front?ttsQ.unshift(it):ttsQ.push(it);if(!speaking)nextTTS()}
function nextTTS(){
 clearTimeout(ttsGuard);const it=ttsQ.shift();
 if(!it){speaking=false;updateMicUI();resumeRec();return}
 speaking=true;abortRec();updateMicUI();
 const u=new SpeechSynthesisUtterance(it.text);u.lang=L(it.lang).sr;

 if(!listening||speaking||editing||rec||!room)return;
 const r=new SR();rec=r;r.lang=L(me.lang).sr;r.interimResults=true;r.continuous=false;r.maxAlternatives=1;

 r.onresult=e=>{let inter='';fin='';for(let i=0;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)fin+=x[0].transcript;else inter+=x[0].transcript}$('#live').textContent=fin+inter;setTalk(true)};

 r.onend=()=>{rec=null;$('#live').textContent='';setTalk(false);const s=fin.trim();if(s&&s!==lastSent){lastSent=s;newDraft(s)}if(listening&&!speaking&&!editing){restartT=setTimeout(runRec,120)}updateMicUI()};
 try{r.start()}catch{rec=null}
}

 genSheet('관리자',`<div class="row"><label>Firebase 설정</label><textarea class="inp" id="aCfg" style="min-height:140px;font-size:13px;font-family:monospace" placeholder="Firebase 콘솔에서 복사한 firebaseConfig 를 통째로 붙여 넣으세요">${esc('const firebaseConfig = '+JSON.stringify(cfg,null,2)+';')}</textarea><div class="hint">Firebase 콘솔 › 프로젝트 설정 › 내 앱 › 구성에서 <b>통째로 복사해 붙여 넣으면</b> 필요한 값만 알아서 골라 저장해요.</div><div class="btns" style="margin-top:10px"><button class="btn" id="aPaste">붙여넣기</button><button class="btn pri" id="aSave">저장하고 다시 연결</button></div><button class="lnk" id="aDef" style="background:none">기본값으로 되돌리기</button></div>
 <div class="row sw"><span id="aStat">${connected?'● Firebase 연결됨':'● 연결 안 됨'}</span><button class="btn" id="aTest">연결 확인</button></div>
 <div class="row"><a class="btn full" style="text-decoration:none" target="_blank" href="https://console.firebase.google.com/project/${esc(cfg.projectId||'')}/database">${icon('ext')}Firebase 콘솔 바로가기</a></div>
 <div class="row"><button class="btn full" id="aFresh">최신 버전 받기 (앱 새로 받기)</button><div class="hint">GitHub에 새 파일을 올렸는데 화면이 그대로일 때 눌러요.</div></div>`);
 $('#aStat').style.color=connected?'var(--teal)':'#E04848';
 $('#aPaste').onclick=async()=>{try{$('#aCfg').value=await navigator.clipboard.readText()}catch{toast('직접 길게 눌러 붙여 넣어 주세요')}};
 $('#aSave').onclick=()=>{const o=parseFbConfig($('#aCfg').value);if(!o){toast('databaseURL 을 찾지 못했어요');return}S.set('fbcfg',o);toast('저장했어요. 다시 연결합니다');setTimeout(()=>location.reload(),700)};
 $('#aDef').onclick=()=>{localStorage.removeItem('rt_fbcfg');toast('기본값으로 되돌렸어요');setTimeout(()=>location.reload(),700)};
 $('#aTest').onclick=async()=>{const st=$('#aStat');st.textContent='확인 중…';try{if(!fb)throw 0;const k=Date.now();await Promise.race([fb.set(R('ping/'+me.cid),k),new Promise((_,j)=>setTimeout(j,5000))]);const s=await fb.get(R('ping/'+me.cid));if(s.val()!==k)throw 0;st.textContent='● 읽기·쓰기 정상';st.style.color='var(--teal)'}catch{st.textContent='● 연결 실패 — 설정과 규칙을 확인하세요';st.style.color='#E04848'}};
 $('#aFresh').onclick=async()=>{try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));const rs=await navigator.serviceWorker?.getRegistrations();await Promise.all((rs||[]).map(r=>r.update().catch(()=>{})))}catch{}location.replace(location.pathname+'?v='+Date.now()+(room?'&room='+room.code:''))};
}

/* ---------- 버튼 연결 ---------- */
document.addEventListener('click',e=>{
 const five=e.target.closest('[data-five]');if(five){fiveTap();return}
 if(e.target.closest('[data-close]')){closeSheet();return}
 if(e.target.closest('#setTabs button')){setTab=e.target.closest('button').dataset.tab;document.querySelectorAll('#setTabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===setTab));renderSetTab();return}
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,id=a.dataset.id;
 switch(act){
  case 'settings':openSettings();break;
  case 'pickLang':langSheet();break;
  case 'create':createRoom();break;
  case 'join':{const c=$('#joinCode').value.replace(/\D/g,'');if(c.length!==6){toast(t('codePh'));return}enterRoom(c);break}
  case 'openRoom':enterRoom(a.dataset.code);break;
  case 'delRoom':delRoom(a.dataset.code);break;
  case 'home':leaveRoom();break;
  case 'people':peopleSheet();break;
  case 'invite':inviteSheet();break;
  case 'share':shareLog();break;
  case 'sound':set.sound=!set.sound;if(!set.sound){speechSynthesis.cancel();ttsQ.length=0}a.classList.toggle('on',set.sound);a.classList.toggle('muted',!set.sound);a.innerHTML=icon(set.sound?'vol':'volx');break;
  case 'clear':clearChat();break;
  case 'mic':listening?stopListen():startListen();break;
  case 'font':{const i=(FS.indexOf(set.fs)+1)%FS.length;set.fs=FS[i];saveSet();updateFs();break}
  case 'drawer':$('#drawer').classList.add('open');$('#dim').classList.add('on');break;
  case 'drawerClose':closeSheet();break;
  case 'sendText':{const x=$('#composeTx');sendNow(x.value);x.value='';x.style.height='';closeSheet();break}
  case 'addPhrase':phraseEdit(null);break;
  case 'say':sayMsg(id);break;
  case 'editDraft':editDraft(id);break;
  case 'cancelDraft':cancelDraft(id);break;
 }
});
$('#dim').onclick=()=>closeSheet();
$('#meName').addEventListener('input',e=>{me.name=e.target.value.trim();S.set('name',me.name);$('#meAva').textContent=(me.name||t('me')).slice(0,1).toUpperCase()});
$('#joinCode').addEventListener('keydown',e=>{if(e.key==='Enter')$('[data-act=join]').click()});
$('#composeTx').addEventListener('input',e=>{const x=e.target;x.style.height='auto';x.style.height=Math.min(120,x.scrollHeight)+'px'});
$('#splash').addEventListener('click',()=>{
 try{speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(' '),{volume:0}))}catch{}
 show('#home');
 if(inviteCode){$('#joinCode').value=inviteCode;if(me.name.trim()){waitFb().then(()=>enterRoom(inviteCode))}else{setTimeout(()=>{toast(t('needName'));$('#meName').focus()},300)}}
});
$('#meName').addEventListener('change',()=>{if(inviteCode&&me.name.trim()&&!room&&$('#joinCode').value===inviteCode)waitFb().then(()=>enterRoom(inviteCode))});
function waitFb(){return new Promise(r=>{let n=0;const c=()=>{if((fb&&connected)||n++>40)r();else setTimeout(c,150)};c()})}
speechSynthesis.onvoiceschanged=()=>{};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---------- 시작 ---------- */
paintIcons();applyTexts();applyTheme();updateFs();renderMe();renderRooms();renderPhrases();
fbInit();
</script>
</body>
</html>
